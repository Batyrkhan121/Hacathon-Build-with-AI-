    location: {landmark_id: airport_nqz}
    at: "2026-10-19T14:00:00+05:00"
    lang: ru
  # В данных у NQZ 3–4 объекта, все кафе. Честный ответ важнее «интересного».
  expected_type: "честно: рядом почти ничего нет, ехать в город за 2 часа до вылета не советуем; максимум кафе в терминале"
