- id: E17
  wave: 8
  title: "Предпочтения меняют подбор"
  request:
    query: "Есть два часа, хочу погулять рядом"
    location: {landmark_id: expo}
    at: "2026-10-20T15:00:00+05:00"
    lang: ru
    prefs: {likes: [museums, no_bars], avoids: [coffee]}
  # eval шлёт тот же запрос без prefs и сравнивает: музеев/галерей больше, кафе меньше.
  expected_type: "с prefs подбор сдвигается к музеям, без баров и меньше кафе; prefs не в логе вместе с местом и запросом"
  expect:
    min_cards: 1
    max_cards: 3
    categories_forbid: [bar, nightlife]
    prefs_shift: {likes_categories: [museum, gallery], avoid_categories: [cafe]}
    forbid_open_claim_without_high: true
    lang: ru

