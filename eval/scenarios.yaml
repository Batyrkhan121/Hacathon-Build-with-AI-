# Qadam: тестовые сценарии для eval (дорожка EVAL, T50).
#
# request  — тело RecommendRequest (app/schemas.py), отправляется как есть.
# expect   — автопроверки только по полям Answer. Ключи разбирает eval/run_eval.py:
#   min_cards / max_cards          число карточек
#   max_walk_min                   walk_min каждой карточки не больше
#   categories_any                 категория каждой карточки из списка
#   categories_forbid              ни одной карточки этих категорий
#   lang                           Answer.lang и алфавит текстов (ru / kk / en)
#   route                          required | optional | none
#   route_fits_budget              route.fits_budget == true
#   route_source                   route.path_source: graph (по тротуарам) | straight
#   labels_required                у карточек есть facts_sources и open_note
#   forbid_open_claim_without_high «открыто сейчас» только при open + high
#   warnings_required              Answer.warnings не пуст
#   warnings_any                   хотя бы один warning содержит одну из подстрок
#   night_safe                     каждая карточка open или с тегом late_open / 24_7
#   wheelchair_honest              у карточки тег wheelchair, иначе предупреждение о доступности
#   text_forbid                    подстроки, которых нет нигде в тексте ответа
#   text_any                       хотя бы одна подстрока есть в summary или warnings
#   intent                         поля Answer.intent, которые должны совпасть
#   data_used                      поля Answer.data_used, которые должны совпасть
#   reject_ok                      неверный ввод: 422 / ValueError или 0 карточек + warning
# Общие инварианты (схема, ранги, одинаковые названия, маршрут ⊆ карточки, why ≤ 2 предл.,
# unknown ≠ high и с пометкой «проверьте / нет данных») проверяются у каждого ответа всегда.
#
# Время: пн 19.10.2026, Астана UTC+5.

# ------------------------------------------------------------------ кейс S1–S5

- id: S1
  title: "Прогулка 30–60 минут у Mega Silk Way"
  request:
    query: "Я сейчас возле Mega Silk Way, хочу прогуляться 30–60 минут — что посоветуете?"
    location: {landmark_id: mega_silk_way}
    at: "2026-10-19T15:00:00+05:00"
    lang: ru
  expected_type: "1–3 места в пешей доступности + мини-маршрут ≤ 60 мин"
  expect:
    min_cards: 1
    max_cards: 3
    max_walk_min: 20
    categories_any: [park, viewpoint, attraction, museum, gallery, mall, cafe, monument, playground, theatre, religious]
    route: optional
    lang: ru
    labels_required: true
    forbid_open_claim_without_high: true

- id: S2
  title: "Тихое место с кофе и розеткой рядом"
  request:
    query: "Хочу тихое место с кофе и розеткой недалеко от меня."
    location: {h3_cell: "892153833a7ffff"}
    at: "2026-10-19T11:00:00+05:00"
    lang: ru
  expected_type: "1–3 кафе/библиотеки рядом; розетка и тишина — только если есть в данных"
  expect:
    min_cards: 1
    max_cards: 3
    max_walk_min: 20
    categories_any: [cafe, library, restaurant, mall]
    lang: ru
    labels_required: true
    forbid_open_claim_without_high: true

- id: S3
  title: "С ребёнком: площадка или интерактивный музей"
  request:
    query: "Еду с ребёнком — где рядом есть детские площадки или музей с интерактивами?"
    location: {landmark_id: expo}
    at: "2026-10-19T12:00:00+05:00"
    lang: ru
  expected_type: "1–3 детских места; без баров и ночных клубов"
  expect:
    min_cards: 1
    max_cards: 3
    max_walk_min: 20
    categories_any: [playground, museum, park, gallery, entertainment, mall, attraction, library, cinema, theatre]
    categories_forbid: [bar, nightlife]
    intent: {with_kids: true}
    lang: ru
    labels_required: true
    forbid_open_claim_without_high: true

- id: S4
  title: "Турист, 2 часа до вылета"
  request:
    query: "Я — турист, у меня 2 часа перед вылетом: что можно посмотреть поблизости?"
    location: {landmark_id: baiterek}
    at: "2026-10-19T14:00:00+05:00"
    lang: ru
  # Пресет в центре: у аэропорта в данных всего 3–4 кафе (см. E11).
  expected_type: "1–2 места рядом, на которые хватит времени с учётом дороги в аэропорт + «выезжайте в аэропорт не позже …»"
  expect:
    min_cards: 1
    max_cards: 2
    max_walk_min: 20
    categories_any: [monument, attraction, viewpoint, museum, gallery, park, religious, theatre, mall, cafe]
    intent: {tourist: true}
    warnings_any: ["аэропорт"]
    route: optional
    route_fits_budget: true
    lang: ru
    labels_required: true
    forbid_open_claim_without_high: true

- id: S5
  title: "Необычная ночная активность"
  request:
    query: "Ищу необычную ночную активность (последние пару часов)."
    location: {landmark_id: khan_shatyr}
    at: "2026-10-19T23:30:00+05:00"
    lang: ru
  expected_type: "места, работающие ночью, с предупреждением о безопасности и честной уверенностью"
  expect:
    min_cards: 1
    max_cards: 3
    intent: {night: true}
    night_safe: true
    warnings_required: true
    lang: ru
    labels_required: true
    forbid_open_claim_without_high: true

# --------------------------------------------------------------- краевые E1–E10

