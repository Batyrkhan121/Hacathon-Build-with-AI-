name: Release checks

on:
  pull_request:
  push:
    branches: [main, 'meyrban/**']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -m ruff check app pipeline eval scripts tests
      - run: python -m pytest -ra
      - run: node --test tests/frontend_state.test.mjs tests/frontend_render.test.mjs
      - run: python -m eval.run_eval --no-llm --strict --out /tmp/qadam-eval
      - run: python -m eval.run_eval --no-llm --strict --scenarios eval/probes.yaml --out /tmp/qadam-probes
