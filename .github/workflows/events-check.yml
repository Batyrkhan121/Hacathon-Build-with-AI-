# Checks the hand-added events (data/manual/events.json) whenever they, their checker or the
# POI they bind to change: fields, https source from the allow-list, no 2GIS/Yandex, venue
# bound to our POI (a venue_poi_id may disappear from a rebuilt poi.jsonl).
name: events-check

on:
  push:
    paths:
      - "data/manual/events.json"
      - "data/manual/event_sources.json"
      - "data/processed/poi.jsonl"
      - "pipeline/events.py"
  pull_request:
    paths:
      - "data/manual/events.json"
      - "data/manual/event_sources.json"
      - "data/processed/poi.jsonl"
      - "pipeline/events.py"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pipeline.events --check
