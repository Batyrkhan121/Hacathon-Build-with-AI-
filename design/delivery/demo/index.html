<!doctype html>
<html lang="kk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Qadam — прогулки по Астане</title>
  <meta name="description" content="ИИ-помощник для прогулок по Астане: 1–3 места рядом, с честными источниками данных и уверенностью.">
  <meta name="theme-color" content="#245fc5">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2l12 7v14l-12 7-12-7V9z' fill='%23245fc5'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23f2b705'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="vendor/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="base.css">
  <script src="vendor/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="" defer></script>
  <script src="vendor/h3.js"
          integrity="sha384-nKUDlg+fT0U/eEt4KWP9n034kLe/eVj6k7CVjbu6qfRhJdEyinlGajS9+9AU+UZ5" crossorigin="anonymous" defer></script>
  <link rel="stylesheet" href="polish.css"><script type="module" src="preview.js"></script>
</head>
<body>
  <a class="skip" href="#results" data-i18n="skip">К результатам</a>

  <div class="app">
    <div class="panel">
      <section class="controls" aria-label="Запрос">
        <header class="brand">
          <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
            <path d="M16 2l12 7v14l-12 7-12-7V9z" fill="currentColor"/>
            <circle cx="16" cy="16" r="4" fill="#f2b705"/>
          </svg>
          <div class="brand-text">
            <h1>Qadam</h1>
            <p class="tagline" data-i18n="app.tagline">ИИ-помощник для прогулок по Астане</p>
          </div>
          <span class="mock-pill" id="mock-pill" hidden data-i18n="app.mock" data-i18n-title="app.mockTitle">Мок-данные</span>
          <div class="lang" role="group" data-i18n-aria="lang.aria" aria-label="Язык интерфейса">
            <button type="button" data-lang="ru" aria-pressed="true">RU</button>
            <button type="button" data-lang="kk" aria-pressed="false">KK</button>
            <button type="button" data-lang="en" aria-pressed="false">EN</button>
          </div>
        </header>

        <section class="block presets" aria-labelledby="presets-title">
          <h2 id="presets-title" class="label" data-i18n="presets.title">Попробуйте сценарий</h2>
          <div class="preset-list" id="presets"></div>
        </section>

        <form id="ask" class="block ask" action="#" novalidate>
          <label for="query" class="label" data-i18n="query.label">Что хотите?</label>
          <div class="query-row">
            <!-- без name: если JS не загрузился, браузер не отправит текст запроса в URL (и в логи) -->
            <textarea id="query" rows="2" maxlength="500" required
                      data-i18n-placeholder="query.placeholder"></textarea>
            <button type="submit" class="btn btn-primary" id="submit">
              <span data-i18n="submit">Подсказать</span>
            </button>
          </div>
          <p class="form-error" id="form-error" role="alert" hidden></p>

          <fieldset class="where">
            <legend class="label" data-i18n="where.legend">Где я</legend>
            <select id="landmark" data-i18n-aria="where.landmark" aria-label="Ориентир"></select>
            <div class="where-actions">
              <button type="button" class="btn btn-ghost" id="geo-btn">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5" fill="currentColor"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="12" r="7" fill="none" stroke="currentColor" stroke-width="2"/></svg>
                <span data-i18n="geo.btn">Моё место</span>
              </button>
              <button type="button" class="btn btn-ghost" id="pick-btn" aria-pressed="false">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7.8 4.5v9L12 21l-7.8-4.5v-9z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
                <span data-i18n="pick.btn">Указать на карте</span>
              </button>
            </div>
            <p class="where-note" id="where-note" aria-live="polite"></p>
          </fieldset>

          <fieldset class="modes">
            <legend class="label" data-i18n="mode.legend">Режим</legend>
            <div class="chips" id="mode-chips"></div>
            <div class="departure" id="departure" hidden>
              <span class="departure-label" id="departure-label" data-i18n="departure.label">Вылет через</span>
              <div class="chips" id="departure-chips" role="group" aria-labelledby="departure-label"></div>
            </div>
            <p class="hint" id="filter-hint" hidden></p>
          </fieldset>

          <fieldset class="filters">
            <legend class="label" data-i18n="filters.legend">Фильтры</legend>
            <div class="chips" id="budget-chips" role="group" data-i18n-aria="budget.aria" aria-label="Сколько есть времени"></div>
            <div class="chips" id="flag-chips"></div>
          </fieldset>

          <fieldset class="when">
            <legend class="label" data-i18n="when.legend">Когда</legend>
            <div class="chips day-chips" id="day-chips" role="group" data-i18n-aria="when.dayAria" aria-label="День"></div>
            <div class="when-row">
              <div class="chips" id="time-chips"></div>
              <input type="time" id="time-input" step="300" data-i18n-aria="when.custom" aria-label="Своё время">
            </div>
            <p class="hint" data-i18n="when.hint">Машина времени для демо, время Астаны (UTC+5)</p>
          </fieldset>
        </form>
      </section>

      <section class="results" id="results" tabindex="-1" aria-labelledby="results-title">
        <h2 id="results-title" class="visually-hidden" data-i18n="results.title">Результаты</h2>
        <p class="status" id="status" role="status"></p>
        <div class="stale" id="stale" hidden>
          <span data-i18n="stale.text">Условия изменились: карточки ниже для прежнего запроса.</span>
          <button type="button" class="btn btn-primary btn-sm" id="stale-btn" data-i18n="stale.btn">Обновить</button>
        </div>
        <div id="answer"></div>
      </section>
    </div>

    <main class="map-wrap">
      <div id="map" role="region" data-i18n-aria="map.aria" aria-label="Карта Астаны"></div>
      <p class="map-fallback" id="map-fallback" hidden data-i18n="map.fallback">Карта не загрузилась. Карточки работают и без неё.</p>
    </main>
  </div>
</body>
</html>
