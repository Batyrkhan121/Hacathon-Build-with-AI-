<script>
        // Transition Logic
        setTimeout(() => {
            const overlay = document.getElementById('intro-overlay');
            const report = document.getElementById('mission-report');
            
            overlay.classList.add('opacity-0');
            setTimeout(() => {
                overlay.style.display = 'none';
                report.classList.add('visible');
            }, 1000);
        }, 2500);

        // Confetti Engine
        function spawnConfetti(e) {
            const colors = ['#cc97ff', '#f673b7', '#ff95a0', '#FFD700'];
            const icons = ['favorite', 'bolt', 'star'];
            const count = 12;
            
            const x = e ? e.clientX : window.innerWidth / 2;
            const y = e ? e.clientY : window.innerHeight / 2;

            for (let i = 0; i < count; i++) {
                const conf = document.createElement('div');
                conf.className = 'confetti material-symbols-outlined';
                conf.innerText = icons[Math.floor(Math.random() * icons.length)];
                conf.style.color = colors[Math.floor(Math.random() * colors.length)];
                conf.style.left = x + 'px';
                conf.style.top = y + 'px';
                conf.style.fontSize = (Math.random() * 20 + 10) + 'px';
                conf.style.fontVariationSettings = "'FILL' 1";
                
                const destX = (Math.random() - 0.5) * 400;
                const destY = (Math.random() - 0.5) * 400;
                
                document.body.appendChild(conf);

                conf.animate([
                    { transform: 'translate(0,0) rotate(0deg)', opacity: 1 },
                    { transform: `translate(${destX}px, ${destY}px) rotate(${Math.random() * 360}deg)`, opacity: 0 }
                ], {
                    duration: 1000 + Math.random() * 1000,
                    easing: 'cubic-bezier(0, .9, .57, 1)'
                }).onfinish = () => conf.remove();
            }
        }

        // Automatic Fanfare on load
        window.addEventListener('DOMContentLoaded', () => {
            const interval = setInterval(() => {
                spawnConfetti();
            }, 300);
            setTimeout(() => clearInterval(interval), 2000);
        });
    </script>
<script>
    const handle = document.getElementById('slider-handle');
    const fill = document.getElementById('slider-fill');
    const valueDisplay = document.getElementById('slider-value');
    const sliderContainer = handle.parentElement;
    const glowClouds = document.querySelectorAll('[class~="bg-primary/20"], [class~="bg-secondary/20"]');

    let isDragging = false;

    function updateSlider(clientY) {
        const rect = sliderContainer.getBoundingClientRect();
        let percentage = ((rect.bottom - clientY) / rect.height) * 100;
        percentage = Math.max(0, Math.min(100, percentage));

        handle.style.bottom = `${percentage}%`;
        fill.style.height = `${percentage}%`;
        valueDisplay.innerText = `${Math.round(percentage)}%`;

        // Update background glow intensity
        const opacity = (percentage / 100) * 0.4 + 0.1;
        glowClouds.forEach(cloud => {
            cloud.style.opacity = opacity;
            cloud.style.filter = `blur(${120 * (percentage/100 + 0.5)}px)`;
        });
    }

    handle.addEventListener('mousedown', (e) => {
        isDragging = true;
        document.body.style.userSelect = 'none';
    });

    window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        updateSlider(e.clientY);
    });

    window.addEventListener('mouseup', () => {
        isDragging = false;
        document.body.style.userSelect = 'auto';
    });

    // Click on track to jump
    sliderContainer.addEventListener('mousedown', (e) => {
        if (e.target === handle) return;
        updateSlider(e.clientY);
    });
