[project]
name = "qadam"
version = "0.1.0"
description = "Qadam — AI walking assistant for Astana (Build with AI hackathon, Smart City case)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".claude", "data", "web", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
